spring:
  application:
    name: company-workhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/workhub}
    username: ${DB_USERNAME:workhub}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
