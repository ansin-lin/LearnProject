spring:
  application:
    name: Company_WorkHub_training-batch
  profiles:
    default: local
  main:
    web-application-type: none
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

workhub:
  redis:
    key-prefix: "company-workhub:local:batch:"
